[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stratified-disparity"
version = "0.1.0"

description = "A fairness metric for revealing hidden disparities in networked data through structural stratification."

readme = "README.md"

requires-python = ">=3.9"

license = {file = "LICENSE"}

authors = [
  {name = "Weixiang Wang"}
]

dependencies = [
  "numpy>=2.0",
  "pandas>=1.3",
  "networkx>=3.0",
  "matplotlib>=3.4",
  "scipy>=1.10",
  "kneed>=0.8"
]

[tool.setuptools.packages.find]
include = ["stratified_disparity*"]